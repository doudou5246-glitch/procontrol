<script>
let user="";
let pin="";
let data={tools:[],users:[]};
let qrScanner=null;

/* ===== LOAD ===== */

async function refreshData(){

const r = await fetch('/api/admin');
data = await r.json();

fillUsers();
}

/* ===== USERS ===== */

function fillUsers(){

let html="";

(data.users || []).forEach(u=>{
html += `<option value="${u.nom}">${u.nom}</option>`;
});

document.getElementById("nom").innerHTML = html;

const last = localStorage.getItem("pc_user");

if(last){
document.getElementById("nom").value = last;
}
}

/* ===== LOGIN (CORRIGÉ) ===== */

async function login(){

const selectedUser =
document.getElementById("nom").value.trim();

const enteredPin =
document.getElementById("pin").value.trim();

if(!selectedUser || !enteredPin){
alert("Nom + PIN");
return;
}

/* Recharge les utilisateurs depuis le serveur */
await refreshData();

/* Vérifie réellement le PIN */
const found =
(data.users || []).find(u =>
String(u.nom).toLowerCase() === selectedUser.toLowerCase() &&
String(u.pin) === enteredPin
);

if(!found){
alert("Mauvais PIN");
return;
}

/* Connexion validée */
user = found.nom;
pin = enteredPin;

sessionStorage.setItem("pc_user", user);
sessionStorage.setItem("pc_pin", pin);
localStorage.setItem("pc_user", user);

document.getElementById("status").innerHTML =
"✅ Connecté : " + user;

/* Si un QR avait déjà été scanné */
const pending =
sessionStorage.getItem("pending_tool");

if(pending){
document.getElementById("tool").value = pending;
}

loadMine();
}

function restore(){

user =
sessionStorage.getItem("pc_user") || "";

pin =
sessionStorage.getItem("pc_pin") || "";

if(user){
document.getElementById("status").innerHTML =
"✅ Connecté : " + user;
}
}

function logout(){

sessionStorage.clear();

user="";
pin="";

document.getElementById("status").innerHTML =
"Non connecté";
}

/* ===== CREATE USER ===== */

async function createUser(){

const nom = prompt("Prénom ?");
if(!nom) return;

const code = prompt("PIN ?");
if(!code) return;

const r = await fetch(
'/api/add-user-admin?nom='+
encodeURIComponent(nom)+
'&pin='+code
);

alert(await r.text());

await refreshData();

document.getElementById("nom").value = nom;
}

/* ===== FIND TOOL ===== */

function norm(x){
return String(x||"")
.toLowerCase()
.trim()
.replace(/\s+/g," ");
}

function findTool(){

let value =
norm(document.getElementById("tool").value);

if(!value) return null;

/* Recherche par ID */
let t = data.tools.find(x =>
String(x.id) === value
);
if(t) return t;

/* Recherche exacte */
t = data.tools.find(x =>
norm(x.nom) === value
);
if(t) return t;

/* Recherche partielle */
t = data.tools.find(x =>
norm(x.nom).includes(value)
);
if(t) return t;

return null;
}

/* ===== TAKE ===== */

async function takeTool(){

if(!user || !pin){
alert("Connecte-toi");
return;
}

await refreshData();

const t = findTool();

if(!t){
alert("Outil introuvable");
return;
}

const r = await fetch(
'/api/take?nom='+
encodeURIComponent(user)+
'&pin='+encodeURIComponent(pin)+
'&id='+encodeURIComponent(t.id)
);

alert(await r.text());

await refreshData();
await loadMine();
}

/* ===== RETURN ===== */

async function returnTool(){

if(!user || !pin){
alert("Connecte-toi");
return;
}

await refreshData();

const t = findTool();

if(!t){
alert("Outil introuvable");
return;
}

const r = await fetch(
'/api/return?nom='+
encodeURIComponent(user)+
'&pin='+encodeURIComponent(pin)+
'&id='+encodeURIComponent(t.id)
);

alert(await r.text());

await refreshData();
await loadMine();
}

/* ===== MY TOOLS ===== */

async function loadMine(){

await refreshData();

let mine =
data.tools.filter(t =>
t.emprunteur === user
);

let html="";

mine.forEach(t=>{

html += `
<div class="tool">
<b>${t.nom}</b><br>
<button class="red"
onclick="quickReturn('${t.id}')">
Rendre
</button>
</div>
`;

});

document.getElementById("mine").innerHTML =
html || "Aucun outil";
}

async function quickReturn(id){

await fetch(
'/api/return?nom='+
encodeURIComponent(user)+
'&pin='+encodeURIComponent(pin)+
'&id='+encodeURIComponent(id)
);

loadMine();
}

async function returnAll(){

await refreshData();

let mine =
data.tools.filter(t =>
t.emprunteur === user
);

for(const t of mine){

await fetch(
'/api/return?nom='+
encodeURIComponent(user)+
'&pin='+encodeURIComponent(pin)+
'&id='+encodeURIComponent(t.id)
);

}

alert("Tout rendu");

loadMine();
}

/* ===== QR ===== */

function extractValue(text){

try{
const url = new URL(text);

const id =
url.searchParams.get("tool") ||
url.searchParams.get("id");

if(id) return id;

}catch(e){}

return text;
}

async function startQR(){

if(qrScanner) return;

document.getElementById("scanLayer").style.display="block";

qrScanner =
new Html5Qrcode("reader");

await qrScanner.start(
{ facingMode:"environment" },
{
fps:10,
qrbox:{width:260,height:260}
},
(decodedText)=>{

const val =
extractValue(decodedText);

document.getElementById("tool").value = val;

sessionStorage.setItem(
"pending_tool",
val
);

stopQR();
}
);
}

async function stopQR(){

if(qrScanner){

await qrScanner.stop();
await qrScanner.clear();

qrScanner=null;
}

document.getElementById("scanLayer").style.display="none";
}

/* ===== INIT ===== */

async function init(){

await refreshData();

restore();

const params =
new URLSearchParams(location.search);

const tool =
params.get("tool") ||
params.get("id");

if(tool){

document.getElementById("tool").value =
tool;

sessionStorage.setItem(
"pending_tool",
tool
);
}

if(user){
loadMine();
}
}

init();
</script>
